<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel de revisión · AI Radio Global</title>
<style>
:root{--bg:#0d0b1a;--card:#1b1735;--bg2:#15122a;--line:#2c2752;--tx:#f4f1ff;--tx2:#b7b0d9;--tx3:#8a83b0;--a3:#ffd60a;--ok:#2ec4b6;--ko:#ff6b75}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,sans-serif}
header{position:sticky;top:0;background:rgba(13,11,26,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);z-index:5}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.hb{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0}
h1{font-size:19px;margin:0 auto 0 0}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button,.btn{border:1px solid var(--line);background:var(--card);color:var(--tx2);border-radius:999px;padding:6px 13px;font:inherit;font-size:14px;cursor:pointer}
.tabs button.on{background:var(--tx);color:var(--bg)}
.btn.ok{background:var(--ok);color:#06201d;border-color:transparent;font-weight:600}
.btn.ko{color:var(--ko)}
.nota{color:var(--tx3);font-size:13px;margin:14px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0;display:grid;grid-template-columns:76px 1fr;gap:16px}
.score{width:76px;height:76px;border-radius:18px;display:grid;place-items:center;font-size:28px;font-weight:700;background:var(--bg2)}
.score small{display:block;font-size:11px;font-weight:500;color:var(--tx3);text-align:center;margin-top:-6px}
.t{font-size:17px;font-weight:700}.a{color:var(--tx3)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font-size:12px;padding:3px 8px;border-radius:7px;background:var(--bg2);color:var(--tx2)}
.chip.adult{background:rgba(230,57,70,.2);color:var(--ko);font-weight:700}
.chip.prog{background:rgba(255,214,10,.14);color:var(--a3);font-weight:600}
ul{margin:6px 0;padding-left:18px;color:var(--tx2);font-size:14px}
li.alerta{color:#ffb3b9}
details{margin:6px 0;color:var(--tx2);font-size:14px}
details pre{white-space:pre-wrap;background:var(--bg2);padding:10px;border-radius:10px;max-height:240px;overflow:auto}
.acc{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
select,input{background:var(--bg2);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:7px 10px;font:inherit;font-size:14px}
audio{width:100%;margin-top:6px;height:36px}
.vacio{color:var(--tx3);padding:40px 0;text-align:center}
@media(max-width:600px){.card{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="wrap hb"><h1>Panel de revisión</h1><div class="tabs" id="tabs"></div></div></header>
<main class="wrap">
  <p class="nota" id="resumen"></p>
  <div id="lista"></div>
</main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ESTADOS=[["pendiente","Por revisar"],["recibida","En cola"],["admitida","Admitidas"],["rechazada","Rechazadas"],["error","Con error"],["todos","Todas"]];
let estado="pendiente", programas={};
const color=p=>p>=80?"#2ec4b6":p>=60?"#ffd60a":p>=40?"#ff8a3d":"#ff6b75";
const mmss=s=>s?`${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,"0")}`:"—";

async function cargar(){
  const r=await fetch(`api/admin/envios?estado=${estado}`,{cache:"no-store"}); const d=await r.json();
  programas=d.programas;
  $("#tabs").innerHTML=ESTADOS.map(([k,t])=>`<button class="${k===estado?"on":""}" data-e="${k}">${t}${d.cuenta[k]?` (${d.cuenta[k]})`:""}</button>`).join("");
  $("#resumen").textContent = estado==="pendiente"
    ? `Ordenadas por la puntuación de la IA (calidad técnica, claridad de la letra y encaje). ${d.en_cola} en cola de análisis. La IA propone; tú decides.`
    : `${d.envios.length} canciones.`;
  $("#lista").innerHTML = d.envios.length ? d.envios.map(tarjeta).join("") : `<div class="vacio">No hay canciones en este estado.</div>`;
}
function tarjeta(e){
  const a=e.analisis||{}, m=a.medidas||{}, p=e.puntuacion??"—";
  const opciones=Object.entries(programas).map(([k,v])=>`<option value="${k}" ${k===(e.programa||a.programa)?"selected":""}>${esc(v)}</option>`).join("");
  return `<div class="card" id="e${e.id}">
   <div><div class="score" style="color:${color(e.puntuacion||0)}">${p}</div><small style="display:block;text-align:center;color:var(--tx3);font-size:11px">de 100</small></div>
   <div>
    <div class="t">${esc(e.titulo)}</div>
    <div class="a">${esc(e.artista)}${e.origen?" · "+esc(e.origen):""} · ${esc(e.email)}</div>
    <div class="chips">
      ${a.programa?`<span class="chip prog">IA propone: ${esc(a.programa_nombre)}</span>`:""}
      ${e.adultos?`<span class="chip adult">+18 · solo de noche</span>`:""}
      <span class="chip">${esc(e.genero)}</span><span class="chip">${esc(e.idioma)}${a.idioma_detectado?` (detectado: ${esc(a.idioma_detectado)})`:""}</span>
      <span class="chip">${esc(e.herramienta)} · plan ${esc(e.plan)} · descarga ${esc(e.fecha_descarga)}</span>
      <span class="chip">${mmss(m.duracion_s)} · ${m.kbps||"?"} kbps · ${m.lufs??"?"} LUFS · ${m.tempo_bpm||"?"} BPM</span>
      <span class="chip">Letra: ${esc(e.letra_autor)}</span>
    </div>
    ${(a.motivos||[]).length||(a.alertas||[]).length?`<ul>${(a.alertas||[]).map(x=>`<li class="alerta">${esc(x)}</li>`).join("")}${(a.motivos||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
    ${a.ia&&a.ia.comentario?`<p style="margin:6px 0;color:var(--tx2);font-size:14px"><b>Comentario IA:</b> ${esc(a.ia.comentario)}</p>`:""}
    ${e.notas?`<details><summary>Notas del creador</summary><pre>${esc(e.notas)}</pre></details>`:""}
    ${a.letra?`<details><summary>Letra transcrita</summary><pre>${esc(a.letra)}</pre></details>`:""}
    ${e.motivo?`<p style="color:var(--ko);font-size:14px">${esc(e.motivo)}</p>`:""}
    <audio controls preload="none" src="api/admin/audio/${e.id}"></audio>
    <div class="acc">
      ${e.estado!=="admitida"?`<select id="p${e.id}">${opciones}</select><button class="btn ok" data-a="admitir" data-id="${e.id}">Admitir y enviar a la radio</button>`:`<span class="chip prog">En emisión: ${esc(programas[e.programa]||e.programa)}</span>`}
      ${e.estado!=="rechazada"&&e.estado!=="admitida"?`<input id="m${e.id}" placeholder="Motivo del rechazo (lo verá el creador)" size="34"><button class="btn ko" data-a="rechazar" data-id="${e.id}">Rechazar</button>`:""}
      <button class="btn" data-a="reanalizar" data-id="${e.id}">Reanalizar</button>
    </div>
   </div></div>`;
}
document.addEventListener("click",async ev=>{
  const t=ev.target.closest("[data-e]"); if(t){estado=t.dataset.e; cargar(); return;}
  const b=ev.target.closest("[data-a]"); if(!b) return;
  const id=b.dataset.id, accion=b.dataset.a, cuerpo={accion};
  if(accion==="admitir") cuerpo.programa=$("#p"+id).value;
  if(accion==="rechazar") cuerpo.motivo=$("#m"+id).value;
  b.disabled=true; b.textContent="…";
  const r=await fetch(`api/admin/envios/${id}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(cuerpo)});
  const d=await r.json().catch(()=>({}));
  if(!r.ok){ b.disabled=false; b.textContent="Reintentar"; const p=document.createElement("p"); p.style.color="var(--ko)"; p.textContent=d.error||"Error"; b.parentNode.after(p); return; }
  $("#e"+id).remove();
});
cargar(); setInterval(()=>{ if(estado!=="todos") cargar(); }, 30000);
</script>
</body>
</html>
